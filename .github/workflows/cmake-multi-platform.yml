name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
         os: [ubuntu-latest]

    env:
      # 1. FORCE vcpkg to use a local folder for caching (Reliable)
      # 'clear' wipes defaults. 'files,...' tells it to read/write to our specific folder.
      # We use ${{ github.workspace }} to ensure the path is valid on all OSes.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # Installing X11/Wayland prevents vcpkg from building them from source
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev

      - uses: lukka/get-cmake@latest

      # 2. CREATE the cache directory manually
      # This ensures the folder exists before the cache action tries to use it
      - name: Create vcpkg cache directory
        shell: bash
        run: mkdir -p ${{ github.workspace }}/vcpkg_cache

      # 3. SETUP GitHub Cache
      # We cache the explicit folder we defined in VCPKG_BINARY_SOURCES.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          # The key includes the OS and the hash of vcpkg.json.
          # If vcpkg.json changes, the cache resets.
          key: ${{ runner.os }}-vcpkg-binaries-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binaries-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        # We do NOT need GITHUB_TOKEN here because we are using local files

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'release'
          buildPreset: 'release'
          testPreset: 'release'
          configurePresetAdditionalArgs: > 
            ["-DSDL_X11=OFF", "-DSDL_X11_XCURSOR=OFF", "-DSDL_X11_XRANDR=OFF", "-DSDL_X11_XI=OFF", "-DSDL_X11_XINERAMA=OFF"]
          
      - name: Zip out directory on failure
        if: failure()
        shell: bash
        run: |
          if [ -d "out" ]; then zip -r out.zip out; fi
          
      - name: Upload out.zip artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out-directory-${{ matrix.os }}
          path: out.zip
