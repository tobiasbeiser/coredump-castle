# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
         # os: [ubuntu-latest, macos-latest, windows-latest]
         os: [windows-latest, macos-latest, ubuntu-latest]

      
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

          
      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt update
          sudo apt install libltdl-dev clang-tidy

      - name: Install dependencies (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm
          echo 'export PATH="/usr/local/opt/llvm/bin:$PATH"' >> $GITHUB_ENV

      - uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        env:
          VCPKG_BINARY_SOURCES: default,rw

      - name: Set up binary cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg*.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-cache-


      - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'release'
          buildPreset: 'release'

    # On failure, zip the out directory
      - name: Zip out directory on failure
        if: failure()  # only runs if a previous step failed
        run: |
          zip -r out.zip out
          
      - name: Upload out.zip artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out-directory
          path: out.zip


