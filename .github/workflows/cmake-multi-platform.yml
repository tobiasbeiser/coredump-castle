# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
         # os: [ubuntu-latest, macos-latest, windows-latest]
         os: [windows-latest, macos-latest]

      
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

          
      - name: Install autotools dependencies (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool libtool-bin m4 pkg-config gettext

      - uses: lukka/get-cmake@latest

      - name: Restore from cache and setup vcpkg executable and data files.
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # Note: if the preset misses the "configuration", it is possible to explicitly select the
      # configuration with the additional `--config` flag, e.g.:
      #   buildPreset: 'ninja-vcpkg'
      #   buildPresetAdditionalArgs: "[`--config`, `Release`]"
      #   testPreset: 'ninja-vcpkg'
      #   testPresetAdditionalArgs: "[`--config`, `Release`]"
      - name: Config
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug
        
      - name: Dump vcpkg manifest install log
        if: always()
        shell: bash
        run: |
          FILE="$GITHUB_WORKSPACE/out/build/debug/vcpkg-manifest-install.log"
          if [ -f "$FILE" ]; then
            echo "====== vcpkg-manifest-install.log (start) ======"
            sed -n '1,4000p' "$FILE"  # adjust lines as needed
            echo "====== vcpkg-manifest-install.log (end) ======"
          else
            echo "File not found: $FILE"
          fi


