name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
         os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      # 1. OPTIMIZATION: Enable native GitHub Actions Binary Caching for vcpkg
      # 'clear' removes default backends. 'x-gha,readwrite' uses the Actions Cache API.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 2. OPTIMIZATION: Install system dependencies + ccache for Linux
      # We install xorg/wayland deps to prevent SDL3 from building them from source
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev ccache libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev

      # 3. OPTIMIZATION: Install ccache for macOS
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      # 4. OPTIMIZATION: Install sccache for Windows (optional, but good)
      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        run: choco install sccache

      - uses: lukka/get-cmake@latest

      # 5. OPTIMIZATION: Expose GITHUB_TOKEN so vcpkg can access the cache API
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'release'
          buildPreset: 'release'
          testPreset: 'release'
          # 6. OPTIMIZATION: Tell CMake to launch ccache
          configurePresetAdditionalArgs: "['-DCMAKE_CXX_COMPILER_LAUNCHER=ccache', '-DCMAKE_C_COMPILER_LAUNCHER=ccache']"

      - name: Zip out directory on failure
        if: failure()
        run: |
          # Ensure 'out' exists before zipping to prevent zip errors
          if [ -d "out" ]; then zip -r out.zip out; fi
          
      - name: Upload out.zip artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out-directory-${{ matrix.os }}
          path: out.zip
